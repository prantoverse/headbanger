<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#14061f" />
  <title>HEADBANGER — gun-fu rhythm runner</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="score-box">
      <div id="score">0</div>
      <div id="combo">x1</div>
      <div id="heat">HEAT <b>1</b></div>
      <div id="streak"><i></i><i></i><i></i><span>HEADSHOT STREAK</span></div>
    </div>
    <div id="focus-ready">FOCUS READY <b>Q</b></div>
    <div id="armor"><span></span></div>
    <div id="biome-name"></div>
    <div id="weapon-box">
      <div id="weapon-name">PISTOL</div>
      <div id="ammo"></div>
    </div>
    <div id="focus-bar"><div></div><span>FOCUS</span></div>
    <div id="alert"><div id="alert-main"></div><div id="alert-sub"></div></div>
    <div id="beat-ring"></div>
    <div id="crosshair"></div>
    <div id="tut" class="hidden">
      <div id="tut-card"><div id="tut-step">STEP 1/10 · MOVE</div><div id="tut-text"></div><button id="btn-gotit">GOT IT ▸</button><div id="tut-hint">tap anywhere / press any key</div></div>
      <div id="charge">
        <div id="charge-pct">0%</div>
        <div id="charge-bar"><div id="charge-fill"></div><div id="charge-ticks"></div></div>
        <div id="charge-label">HEADBANG CHARGE</div>
      </div>
      <button id="btn-skip">SKIP ▸</button>
    </div>
    <div id="pops"></div>
    <div id="touch-ui">
      <button id="btn-pause" aria-label="Pause">II</button>
      <button id="btn-focus">FOCUS</button>
      <button id="btn-throw">THROW</button>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="menu-wrap">
      <div class="panel menu-main">
        <h1 id="title">HEAD<span>BANGER</span></h1>
        <p class="tag">gun-fu · synth beats · bullet time</p>
        <div class="style-pick">
          <div class="sp-title">SELECT YOUR STYLE</div>
          <div class="sp-row">
            <button class="style-card comic" data-style="comic"><b>COMIC</b><span>fever-dream comic book · katana</span></button>
            <button class="style-card grid" data-style="grid"><b>GRID</b><span>dark neon · photon blade · french house</span></button>
          </div>
        </div>
        <button id="btn-play">PLAY</button>
        <p class="best" id="best"></p>
        <button id="btn-lb" class="secondary lb-open">🏆 LEADERBOARD</button>
        <p class="hint" id="menu-hint"></p>
      </div>
      <button id="btn-tutorial" class="notepad" aria-label="Tutorial">
        <div class="spiral"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="sheet">
          <div class="np-note">complete ✓</div>
          <div class="np-title">Tutorial</div>
          <svg class="np-strike" viewBox="0 0 200 40" preserveAspectRatio="none"><path d="M4 26 C 40 18, 70 30, 104 20 S 170 14, 196 22" /><path d="M10 31 C 60 24, 120 30, 190 17" /></svg>
          <div class="np-sub">10 quick moves · learn the gun-fu</div>
        </div>
      </button>
    </div>
  </div>

  <div id="ready" class="hidden">
    <div class="ready-burst"></div>
    <div class="ready-small">100% CHARGED</div>
    <div class="ready-big">READY TO<br><span>HEADBANG!</span></div>
  </div>

  <div id="over" class="screen hidden">
    <div class="panel">
      <h2>WASTED</h2>
      <div id="final"></div>
      <div class="over-btns"><button id="btn-again">AGAIN</button><button id="btn-menu" class="secondary">MENU</button></div>
      <div id="lb-result"></div>
      <div class="lb-name" id="over-name"></div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="panel pause-panel">
      <h2>PAUSED</h2>
      <button id="btn-resume">RESUME</button>
      <button id="btn-pause-menu" class="secondary">MENU</button>
      <p class="hint">Esc / P to resume</p>
    </div>
  </div>

  <div id="lb" class="screen hidden">
    <div class="panel lb-panel">
      <h2>LEADERBOARD</h2>
      <div class="lb-tabs" id="lb-style"><button data-v="comic">COMIC</button><button data-v="grid">GRID</button></div>
      <div class="lb-tabs small" id="lb-period"><button data-v="week">THIS WEEK</button><button data-v="all">ALL-TIME</button></div>
      <div id="lb-list"><div class="lb-empty">Loading…</div></div>
      <div class="lb-name" id="lb-name"></div>
      <button id="btn-lb-close" class="secondary">CLOSE</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
